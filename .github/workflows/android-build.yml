
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found"
            ls -la
            exit 1
          fi
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Find Android project
        id: project
        run: |
          WRAPPER=$(find android-project -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found. ZIP may not contain an Android Gradle project."
            find android-project -maxdepth 4 -type f | head -200
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sandeep-Android-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
